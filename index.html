<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Grade Calculator - EMCT311</title>
<style>
    *{box-sizing:border-box;font-family:Arial, sans-serif}
    body{max-width:900px;margin:20px auto;padding:20px;background:#f5f5f5}
    .header{text-align:center;background:#4CAF50;color:white;padding:15px;border-radius:10px;margin-bottom:20px}
    .header h1{margin:5px 0}
    .header p{margin:3px 0;font-size:14px}
    .card{background:white;padding:20px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,0.1);margin-bottom:20px}
    input,button{padding:10px;margin:5px;border:1px solid #ddd;border-radius:5px}
    input{width:100%}
    button{background:#4CAF50;color:white;border:none;cursor:pointer;font-weight:bold}
    button:hover{background:#45a049}
    button.delete{background:#f44336}
    table{width:100%;border-collapse:collapse;margin-top:15px}
    th,td{padding:10px;border:1px solid #ddd;text-align:left}
    th{background:#4CAF50;color:white}
    .pass{color:green;font-weight:bold}
    .fail{color:red;font-weight:bold}
</style>
</head>
<body>

<div class="header">
    <h1>Student Grade Calculator</h1>
    <p><b>Course:</b> EMCT311 | <b>Name:</b> ONYEAKA VICTORY EKENE | <b>Reg No:</b> 2023030211276</p>
</div>

<div class="card">
    <h3>Add New Student</h3>
    <input type="text" id="name" placeholder="Student Name" required>
    <input type="number" id="score1" placeholder="Assessment Score 1 (0-100)" min="0" max="100" required>
    <input type="number" id="score2" placeholder="Assessment Score 2 (0-100)" min="0" max="100" required>
    <input type="number" id="score3" placeholder="Assessment Score 3 (0-100)" min="0" max="100" required>
    <button onclick="addStudent()">Calculate & Save</button>
</div>

<div class="card">
    <h3>All Student Records</h3>
    <table id="studentTable">
        <thead>
            <tr>
                <th>Name</th><th>Scores</th><th>Total</th><th>Average</th><th>Grade</th><th>Status</th><th>Action</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script>
let students = JSON.parse(localStorage.getItem('students')) || [];

function addStudent(){
    const name = document.getElementById('name').value.trim();
    const s1 = parseFloat(document.getElementById('score1').value);
    const s2 = parseFloat(document.getElementById('score2').value);
    const s3 = parseFloat(document.getElementById('score3').value);

    if(!name){
        alert("Please enter student name"); 
        return;
    }
    if(isNaN(s1) || isNaN(s2) || isNaN(s3)){
        alert("Please enter all 3 scores"); 
        return;
    }

    // VALIDATION: THIS STOPS ANYTHING ABOVE 100 OR BELOW 0
    if(s1 < 0 || s1 > 100 || s2 < 0 || s2 > 100 || s3 < 0 || s3 > 100){
        alert("Error: All scores must be between 0 and 100");
        return; // stops calculation
    }

    const total = s1 + s2 + s3;
    const average = (total / 3).toFixed(2);
    
    let grade = 'F';
    if(average >= 70) grade = 'A';
    else if(average >= 60) grade = 'B';
    else if(average >= 50) grade = 'C';
    else if(average >= 45) grade = 'D';
    else if(average >= 40) grade = 'E';
    
    const status = (grade === 'A' || grade === 'B' || grade === 'C') ? 'Pass' : 'Fail';
    
    const student = {
        id: Date.now(), 
        name, 
        scores:`${s1}, ${s2}, ${s3}`, 
        total, 
        average, 
        grade, 
        status
    };
    
    students.push(student); 
    saveAndDisplay();
    
    // Clear form
    document.getElementById('name').value='';
    document.getElementById('score1').value='';
    document.getElementById('score2').value='';
    document.getElementById('score3').value='';
}

function deleteStudent(id){
    if(confirm("Delete this student?")){
        students = students.filter(s => s.id !== id);
        saveAndDisplay();
    }
}

function saveAndDisplay(){
    localStorage.setItem('students', JSON.stringify(students));
    displayStudents();
}

function displayStudents(){
    const tbody = document.querySelector('#studentTable tbody');
    tbody.innerHTML = '';
    if(students.length === 0){
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center">No records yet. Add a student above.</td></tr>';
        return;
    }
    students.forEach(s => {
        tbody.innerHTML += `<tr>
            <td>${s.name}</td>
            <td>${s.scores}</td>
            <td>${s.total}</td>
            <td>${s.average}</td>
            <td>${s.grade}</td>
            <td class="${s.status.toLowerCase()}">${s.status}</td>
            <td><button class="delete" onclick="deleteStudent(${s.id})">Delete</button></td>
        </tr>`;
    });
}

displayStudents();
</script>
</body>
</html>
